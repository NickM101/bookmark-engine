<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="folio-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Vibrant cyan to violet intelligence accent gradient -->
    <linearGradient id="folio-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Subtle page highlight -->
    <linearGradient id="folio-page-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Soft shadow -->
    <filter id="folio-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Rounded Container -->
  <rect width="512" height="512" rx="116" fill="url(#folio-surface)" />
  <rect width="510" height="510" x="1" y="1" rx="115" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <!-- Main Emblem Group -->
  <g filter="url(#folio-shadow)" transform="translate(112, 106)">
    <!-- 1. The Book Spine / Open Cover (Left) -->
    <path
      d="M32 284V42C32 25.4315 45.4315 12 62 12H136C142.627 12 148 17.3726 148 24V27C148 33.6274 142.627 39 136 39H66C59.3726 39 54 44.3726 54 51V284C54 290.627 48.6274 296 42 296C35.3726 296 32 290.627 32 284Z"
      fill="#f4f4f5"
    />

    <!-- 2. The Back Page Slab of the 'B' (Depth / Stack) -->
    <path
      d="M86 48C86 35.8497 95.8497 26 108 26H182C226.183 26 260 55.485 260 94C260 119.537 244.629 141.527 221.758 152.884C252.128 164.717 272 191.077 272 222C272 265.078 233.513 300 186 300H108C95.8497 300 86 290.15 86 278V48Z"
      fill="url(#folio-page-glow)"
    />

    <!-- 3. The Solid Modern 'B' Shape (Book pages / Fold) -->
    <path
      d="M96 52C96 43.1634 103.163 36 112 36H180C218.66 36 248 62.8629 248 96C248 118.966 233.742 138.648 213.25 148.513C239.52 158.853 258 183.178 258 212C258 250.66 223.34 282 182 282H112C103.163 282 96 274.837 96 266V52Z"
      fill="#fafafa"
    />

    <!-- 4. Top and Bottom Inner Page Counters of the 'B' (Dark Cutouts with clean radius) -->
    <rect x="130" y="68" width="56" height="54" rx="14" fill="#09090b" />
    <rect x="130" y="166" width="66" height="66" rx="16" fill="#09090b" />

    <!-- 5. Signature Bookmark Ribbon in the Negative Space / Inner Fold -->
    <!-- Elegantly hangs between spine and the B body, with a sharp chevron cut at the bottom -->
    <path
      d="M66 12H92C95.3137 12 98 14.6863 98 18V134L80 118L62 134V16C62 13.7909 63.7909 12 66 12Z"
      fill="url(#folio-ribbon)"
    />

    <!-- 6. Micro AI Spark / Intelligence Node -->
    <circle cx="218" cy="96" r="4.5" fill="#38bdf8" />
  </g>
</svg>
